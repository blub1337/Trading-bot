[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-engine-okx"
version = "0.1.0"
description = "Autonomous OKX crypto trading system (paper/simulation only)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.2,<3",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
trading-engine-okx = "trading_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_engine*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"